[build-system]
requires = [
    'hatchling',
]
build-backend = 'hatchling.build'


[project]
name = 'flask-hypergen'
authors = [
    {name = 'Randy Syring', email = 'randy.syring@level12.io'},
]
requires-python = '>=3.11'
dynamic = ['version']
readme = 'readme.md'
dependencies = [
    "flask>=3.1.3",
    "pyrsistent>=0.20.0",
    "yattag>=1.16.1",
]


[dependency-groups]
dev = [
    {include-group = "examples"},
    {include-group = "pytest"},
    {include-group = "prek"},
    {include-group = "audit"},
    {include-group = "nox"},
    'click',
    'ruff',
]
# Used by nox
pytest = [
    {include-group = "examples"},
    "playwright>=1.59.0",
    'pytest',
    'pytest-cov',
    "pytest-playwright>=0.7.2",
]
# Used by nox
prek = [
    'prek',
]
# Used by nox
audit = [
    'pip-audit',
]
# Used by CI
nox = [
    'nox',
]
examples = [
    "flask-login>=0.6.3",
    "sqlalchemy>=2.0.49",
]

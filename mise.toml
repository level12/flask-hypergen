[hooks]
enter = "uv sync"


[tools]
aube = '1.32.0'
node = '24.20.0'
rumdl = 'latest'


[settings]
# Have mise get it's Python version from .python-version.  We get two other benefits:
# 1) uv, apart from mise, will pick the correct python version, and `uv run` and similar can be used
#   apart from mise.
# 2) GitHub's setup-python action can be directed to the .python-version file
idiomatic_version_file_enable_tools = ["python"]

python.uv_venv_auto = "create|source"


[task_config]
includes = [
    'tasks',
]


################ TASKS #################
[tasks.pytest-cov]
description = 'Full pytest run with html coverage report'
# .coveragerc sets html output directory to: tmp/coverage-html
# But coverage only looks for the rc file in the CWD, so start in proj root.
dir = "{{ config_root }}"
run = 'pytest --cov --cov-report=html --no-cov-on-fail'


[tasks.build-js]
description = 'Build the packaged Hypergen browser runtime'
dir = "{{ config_root }}"
run = 'aube run build'


[tasks.watch-js]
description = 'Watch Hypergen JavaScript source and rebuild the packaged runtime'
dir = "{{ config_root }}"
run = 'aube run watch'


[tasks.verify-js]
description = 'Rebuild JavaScript and verify the committed assets are current'
dir = "{{ config_root }}"
run = [
    'aube run --no-install build',
    'git ls-files --error-unmatch -- src/flask_hypergen/static/hypergen.js src/flask_hypergen/static/hypergen.js.map',
    'git diff --exit-code -- src/flask_hypergen/static/hypergen.js src/flask_hypergen/static/hypergen.js.map',
]


[tasks.check-js]
description = 'Verify the frozen JavaScript build is reproducible'
dir = "{{ config_root }}"
run = [
    'aube ci',
    'mise run verify-js',
]


[tasks.upgrade-deps]
description = 'Upgrade mise, uv, and prek dependencies'
dir = "{{ config_root }}"
run = [
    'mise upgrade --local',
    'uv sync --upgrade',
    'prek update',
]

[tasks.examples-run]
description = 'Run examples app'
dir = "{{ config_root }}/examples"
run = [
    'flask run --debug || true',
]
